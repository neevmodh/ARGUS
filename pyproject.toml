[project]
name = "argus"
version = "0.1.0"
description = "ARGUS: Accident Risk Grid & Unified Streaming - a Lambda-architecture big data platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
